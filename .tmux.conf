set -g mouse on
set-option -g history-limit 5000
#set -g default-terminal "screen-256color"
#set -g default-terminal "xterm-kitty"

# True color support (critical for neovim consistency)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",ghostty:RGB"


setw -g mode-keys vi
set -g xterm-keys on
set -g renumber-windows on
set -g status-position bottom

set -g status-left-length 100
set -g status-right-length 100



# Update the prefix
# unbind C-b
# unbind C-Space
# set -g prefix C-Space
# bind C-Space send-prefix

# Horizontal split
bind '"' split-window -hc "#{pane_current_path}"

#bind-key "\=" split-window -h -c "#{pane_current_path}"
#bind-key "\\" split-window -fh -c "#{pane_current_path}"

# Vertical split
bind '=' split-window -vc "#{pane_current_path}"

#bind-key "\"" split-window -v -c "#{pane_current_path}"
#bind-key "_" split-window -fv -c "#{pane_current_path}"

# Create new window with current path
bind c new-window -c "#{pane_current_path}"

# Resizing
bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

#Moving
bind -n C-S-Left swap-window -t -1\; previous-window
bind -n C-S-Right swap-window -t +1\; next-window

# Closing
unbind &  # unbind default close window
bind X confirm-before -p "kill window? (y/n)" kill-window

unbind x # unbind default close pane that includes confirmation
bind x kill-pane

# Synchronizing panes
bind e set-window-option synchronize-panes \; display-message "Synchronized panes toggled"

# Reloading tmux.conf
bind r source-file ~/.tmux.conf \; display-message "Reloaded tmux config!"

# Clear screen
bind -n C-k send-keys -R \; clear-history \; send-keys "" Enter



#### theme plugins

# catpuccin
## latte, frappe, macchiato, mocha
set -g @catppuccin_flavor 'mocha'

# Required for catppuccin v2 to show status bar
#set -g @catppuccin_window_status_style "rounded"  # rounded corners  
#set -g @catppuccin_window_status_style "square"    # square corners
set -g @catppuccin_window_status_style "slanted"   # powerline arrow style
#set -g @catppuccin_window_status_style "custom"    # define your own separators
#set -g @catppuccin_window_status_style "none"      # no decoration, plain text
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_session_text " #{session_name}"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "application date_time"
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"

# Prevent auto-rename
set -g allow-rename off
set -g automatic-rename off
set -g status on
set -g status-interval 60

