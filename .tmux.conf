# Auto-restore on tmux start
set -g @continuum-restore 'on'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'  # optional, for auto-save
set -g @plugin 'catppuccin/tmux'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'


# Command prompt and message styling (separates from status bar visually)
set -g message-style 'bg=#a6e3a1 fg=#1e1e2e bold'          # error/info messages
set -g message-command-style 'bg=#f9e2af fg=#1e1e2e bold'  # command prompt (rename, kill confirm etc)
