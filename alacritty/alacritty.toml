[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10

#decorations = "Buttonless"

opacity = 0.9
blur = true

option_as_alt = "Both"

[font]
#normal.family = "Consolas for powerline"
#normal.family = "Inconsolata-g for powerline"
#normal.family = "RobotoMono Nerd Font Mono"
#normal.family = "Akkurat Mono"
normal.family = "sf mono"
#normal.family = "JetbrainsMonoNL Nerd Font Mono"
#normal.family = "Monaspace Neon"
#normal.family = "IBM Plex Mono"

size = 18
